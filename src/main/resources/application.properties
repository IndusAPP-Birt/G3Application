# suppress inspection "UnusedProperty" for whole file
# suppress inspection "SpellCheckingInspection" for whole file

spring.application.name=g3

spring.datasource.url=jdbc:h2:mem:g3;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

preventive.generation.cron=${PREVENTIVE_GENERATION_CRON:0 */5 * * * *}
preventive.generation.zone=${PREVENTIVE_GENERATION_ZONE:Europe/Madrid}
