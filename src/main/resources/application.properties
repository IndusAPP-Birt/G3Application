# suppress inspection "UnusedProperty" for whole file
# suppress inspection "SpellCheckingInspection" for whole file

spring.application.name=g3

spring.datasource.url=${NEON_JDBC_URL}

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false

security.jwt.signing-key=${JWT_SIGNING_KEY}
security.jwt.issuer=g3
security.jwt.access-token-ttl=15m

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

preventive.generation.cron=${PREVENTIVE_GENERATION_CRON:0 0 6 * * *}
preventive.generation.zone=${PREVENTIVE_GENERATION_ZONE:Europe/Madrid}
