# suppress inspection "UnusedProperty" for whole file
# suppress inspection "SpellCheckingInspection" for whole file

spring.application.name=g3

server.port=8085

# Base de datos H2 en memoria; sus datos se eliminan al detener la aplicación.
spring.datasource.url=jdbc:h2:mem:g3db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Recrea el esquema en cada arranque; adecuado únicamente para desarrollo.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
# Ejecuta scripts de inicialización después de que Hibernate cree el esquema.
spring.jpa.defer-datasource-initialization=true

# Deshabilita la consola H2 para desarrollo.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
