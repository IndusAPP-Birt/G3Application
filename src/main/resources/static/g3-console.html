<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>G3</title>
    <style>
        :root { color: #202124; background: #fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; } body { margin: 0; min-width: 320px; } button, input, select, textarea { font: inherit; } button { border: 0; cursor: pointer; }
        header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 28px; padding: 16px 72px; border-bottom: 1px solid #e5e7eb; background: #fff; } header h1 { margin: 0; font-size: 1rem; font-weight: 650; }
        .app { min-height: calc(100vh - 53px); padding: 26px 72px 48px; display: grid; gap: 18px; } main { min-width: 0; }
        .breadcrumb { display: flex; align-items: center; gap: 7px; color: #737373; font-size: .78rem; min-height: 18px; }.breadcrumb strong { color: #404040; font-weight: 600; }
        .hero { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin: 12px 0 16px; } h2 { margin: 0; color: #171717; font-size: 1.4rem; font-weight: 650; letter-spacing: -.02em; }.hero p { margin: 4px 0 0; color: #737373; max-width: 720px; font-size: .9rem; }
        .endpoint { flex: 0 1 430px; padding: 7px 0; color: #525252; font: .78rem ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }.method { color: #404040; font-weight: 700; }.method.put, .method.post { color: #404040; }
        .operation-tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 0 12px; margin-bottom: 0; border-bottom: 1px solid #e5e7eb; }.operation-tabs button { flex: 0 0 auto; padding: 7px 9px; background: transparent; color: #737373; font-size: .82rem; }.operation-tabs button:hover { color: #171717; }.operation-tabs button.active { color: #171717; font-weight: 650; box-shadow: inset 0 -1px #171717; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 4px; }.result-card { overflow: hidden; }.card-header { padding: 14px 16px 11px; border-bottom: 1px solid #ededed; }.card-header h3 { margin: 0; font-size: .92rem; color: #262626; }.card-header p { margin: 4px 0 0; color: #737373; font-size: .8rem; }
        form { display: grid; gap: 12px; }.form-body { display: grid; gap: 10px; } label { display: grid; gap: 5px; color: #404040; font-size: .8rem; font-weight: 600; }.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } input, select, textarea { width: 100%; padding: 8px 9px; border: 1px solid #d4d4d4; border-radius: 3px; background: #fff; color: #262626; outline: none; } textarea { min-height: 96px; resize: vertical; font: .77rem ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.45; } input:focus, select:focus, textarea:focus { border-color: #525252; }.hint { margin: 0; padding: 8px 9px; border-left: 2px solid #a3a3a3; color: #737373; font-size: .78rem; line-height: 1.42; }.execute { width: max-content; padding: 8px 11px; border-radius: 3px; background: #262626; color: #fff; font-size: .84rem; font-weight: 600; }.execute:hover { background: #404040; }.execute:disabled { opacity: .62; cursor: wait; }
        .response-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; background: #fafafa; border-bottom: 1px solid #ededed; color: #737373; font-size: .78rem; }.response-meta code { color: #525252; }.status { white-space: nowrap; font-weight: 650; }.status.ok { color: #404040; }.status.error { color: #a33; }.empty { padding: 42px 24px; color: #737373; text-align: center; font-size: .86rem; }.empty strong { display: block; color: #404040; margin-bottom: 5px; }.result-table-wrap { overflow: auto; max-height: 360px; }.result-table { width: 100%; border-collapse: collapse; font-size: .81rem; }.result-table th, .result-table td { padding: 9px 12px; border-bottom: 1px solid #f0f0f0; text-align: left; vertical-align: top; white-space: nowrap; }.result-table th { position: sticky; top: 0; background: #fafafa; color: #737373; font-size: .7rem; text-transform: uppercase; letter-spacing: .035em; }.result-table td { color: #404040; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }.result-table tbody tr:hover { background: #fcfcfc; }.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 9px 12px; border-top: 1px solid #ededed; color: #737373; font-size: .76rem; }.pagination button { padding: 4px 7px; border: 1px solid #d4d4d4; border-radius: 3px; background: #fff; color: #404040; font-size: .76rem; }.pagination button:disabled { color: #b0b0b0; cursor: default; }.pagination select { width: auto; padding: 4px 24px 4px 6px; border-color: #d4d4d4; border-radius: 3px; font-size: .76rem; } details { border-top: 1px solid #ededed; } summary { padding: 11px 16px; color: #737373; cursor: pointer; font-size: .8rem; font-weight: 600; } pre { margin: 0; padding: 0 16px 16px; max-height: 310px; overflow: auto; color: #404040; background: #fcfcfc; font: .76rem/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
        .entity-menu { display: flex; align-items: center; gap: 4px; overflow-x: auto; }.entity-menu button { display: flex; align-items: center; gap: 6px; padding: 5px 7px; background: transparent; color: #737373; text-align: left; font-size: .8rem; white-space: nowrap; }.entity-menu button:hover { color: #171717; }.entity-menu button.active { color: #171717; font-weight: 650; }.entity-icon { display: grid; place-items: center; width: 17px; height: 17px; border: 1px solid currentColor; border-radius: 3px; font-size: .61rem; font-weight: 700; }
        @media (max-width: 800px) { header { gap: 16px; padding: 14px 28px; }.app { padding: 20px 28px 36px; } } @media (max-width: 620px) { header { gap: 12px; padding: 12px 16px; }.entity-menu .label { display: none; }.app { padding: 18px 16px 30px; }.hero { display: block; }.endpoint { margin-top: 10px; text-align: left; }.field-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header><h1>G3</h1><nav class="entity-menu" id="entity-menu" aria-label="Entidades"></nav></header>
<div class="app">
    <main>
        <nav class="breadcrumb" aria-label="Ruta"><span>Consola</span><span>›</span><strong id="breadcrumb-entity">Usuarios</strong><span>›</span><span id="breadcrumb-action">Consultar</span></nav>
        <section class="hero"><div><h2 id="entity-title">Usuarios</h2><p id="entity-description"></p></div><div class="endpoint"><span class="method" id="endpoint-method">GET</span> <span id="endpoint-path">/api/users</span></div></section>
        <nav class="operation-tabs" id="operation-tabs" aria-label="Operaciones"></nav>
    </main>
    <section class="card request-card"><div class="card-header"><h3 id="request-title">Consulta</h3><p id="request-description"></p></div><div style="padding:16px"><form id="request-form" novalidate><div class="form-body" id="form-body"></div><button class="execute" id="execute-button" type="submit">Ejecutar consulta</button></form></div></section>
    <section class="card result-card"><div class="card-header"><h3>Resultado</h3><p>La respuesta se muestra aquí sin ocultar el formulario utilizado.</p></div><div class="response-meta"><code id="executed-endpoint">Aún no se ha ejecutado ningún endpoint.</code><span class="status" id="response-status"></span></div><div id="result-content"><div class="empty"><strong>Preparado para consultar</strong>Selecciona una operación, completa los datos necesarios y ejecútala.</div></div></section>
</div>
<script>
const textField=(name,label,example,required=true,type='text')=>({name,label,example,required,type});
const selectField=(name,label,values,required=true)=>({name,label,values,required,type:'select'});
const pagination=[{...textField('page','Página','0',false,'number'),resultControl:true},{...textField('size','Tamaño','20',false,'number'),resultControl:true}];
const jsonField=value=>({name:'payload',label:'Cuerpo JSON',value:JSON.stringify(value,null,2),type:'json',required:true});
const entities={
users:{label:'Usuarios',icon:'U',description:'Consulta, alta y actualización de usuarios, credenciales y roles.',actions:[
['Listado','GET','/api/users','Página de usuarios registrados.',pagination],['Roles','GET','/api/users/roles','Catálogo de roles disponibles.',[]],['Por ID','GET','/api/users/{id}','Consulta individual por identificador.',[textField('id','Identificador','1',true,'number')]],['Por correo','GET','/api/users/by-email','Búsqueda parcial; no exige un correo completo.',[textField('email','Texto a buscar','ana'),...pagination]],['Por estado','GET','/api/users/by-status','Usuarios habilitados o deshabilitados.',[selectField('enabled','Habilitado',[['true','Sí'],['false','No']]),...pagination]],['Por rol','GET','/api/users/by-role','Usuarios asignados a un rol.',[selectField('role','Rol',[['ROLE_ADMINISTRATOR','ROLE_ADMINISTRATOR'],['ROLE_INSPECTOR','ROLE_INSPECTOR'],['ROLE_MAINTENANCE_TECHNICIAN','ROLE_MAINTENANCE_TECHNICIAN']]),...pagination]],['Crear','POST','/api/users','Da de alta un usuario.',[jsonField({name:'',lastName:'',email:'',password:'',role:'ROLE_INSPECTOR'})]],['Actualizar','PUT','/api/users/{id}','Actualiza datos, rol y acceso del usuario.',[textField('id','Identificador','1',true,'number'),jsonField({name:'',lastName:'',email:'',role:'ROLE_INSPECTOR',enabled:true})]],['Contraseña','PUT','/api/users/{id}/password','Restablece la contraseña de un usuario.',[textField('id','Identificador','1',true,'number'),jsonField({password:''})]]]},
machines:{label:'Máquinas',icon:'M',description:'Catálogo de activos industriales y su estado operativo.',actions:[
['Listado','GET','/api/machines','Página de máquinas registradas.',pagination],['Estados','GET','/api/machines/statuses','Catálogo de estados de máquina.',[]],['Por ID','GET','/api/machines/{id}','Consulta una máquina por identificador.',[textField('id','Identificador','1',true,'number')]],['Por código','GET','/api/machines/by-asset-code','Búsqueda parcial por código patrimonial.',[textField('assetCode','Código patrimonial','MAQ'),...pagination]],['Por serie','GET','/api/machines/by-serial-number','Búsqueda parcial por número de serie.',[textField('serialNumber','Número de serie','SN'),...pagination]],['Por estado','GET','/api/machines/by-status','Filtro de estado operativo.',[selectField('status','Estado',[['ACTIVE','ACTIVE'],['INACTIVE','INACTIVE'],['RETIRED','RETIRED']]),...pagination]],['Crear','POST','/api/machines','Registra una nueva máquina.',[jsonField({assetCode:'',name:'',manufacturer:'',model:'',serialNumber:'',location:'',commissionedAt:'2026-01-01'})]],['Actualizar','PUT','/api/machines/{id}','Actualiza los datos operativos de una máquina.',[textField('id','Identificador','1',true,'number'),jsonField({name:'',manufacturer:'',model:'',serialNumber:'',location:'',status:'ACTIVE'})]],['Código','PUT','/api/machines/{id}/asset-code','Actualiza únicamente el código patrimonial.',[textField('id','Identificador','1',true,'number'),jsonField({assetCode:''})]]]},
plans:{label:'Planes preventivos',icon:'P',description:'Configuración del mantenimiento periódico de cada máquina.',actions:[
['Listado','GET','/api/preventive-plans','Página de planes preventivos.',pagination],['Por ID','GET','/api/preventive-plans/{id}','Consulta individual por identificador.',[textField('id','Identificador','1',true,'number')]],['Por máquina','GET','/api/preventive-plans/by-machine/{machineId}','Planes asociados a una máquina.',[textField('machineId','Identificador de máquina','1',true,'number'),...pagination]],['Por estado','GET','/api/preventive-plans/by-status','Planes activos o inactivos.',[selectField('active','Activo',[['true','Sí'],['false','No']]),...pagination]],['Por nombre','GET','/api/preventive-plans/by-name','Búsqueda parcial por nombre.',[textField('name','Nombre','Revisión'),...pagination]],['Por fecha','GET','/api/preventive-plans/by-next-due-date','Próximas fechas previstas dentro de un rango inclusivo.',[textField('from','Desde','2026-01-01',true,'date'),textField('to','Hasta','2026-12-31',true,'date'),...pagination]],['Crear','POST','/api/preventive-plans','Crea un plan para una máquina existente.',[jsonField({machineId:1,name:'',description:'',intervalDays:30,noticeDays:7,nextDueDate:'2026-12-01'})]],['Actualizar','PUT','/api/preventive-plans/{id}','Actualiza configuración y activación del plan.',[textField('id','Identificador','1',true,'number'),jsonField({name:'',description:'',intervalDays:30,noticeDays:7,active:true})]]]},
preventives:{label:'Preventivos',icon:'E',description:'Ejecuciones generadas a partir de un plan y su ciclo de trabajo.',actions:[
['Listado','GET','/api/preventives','Página de ejecuciones preventivas.',pagination],['Por ID','GET','/api/preventives/{id}','Consulta una ejecución por identificador.',[textField('id','Identificador','1',true,'number')]],['Por plan','GET','/api/preventives/by-plan/{preventivePlanId}','Ejecuciones de un plan preventivo.',[textField('preventivePlanId','Identificador de plan','1',true,'number'),...pagination]],['Por estado','GET','/api/preventives/by-status','Filtro por estado del ciclo de vida.',[selectField('status','Estado',[['PENDING','PENDING'],['ASSIGNED','ASSIGNED'],['IN_PROGRESS','IN_PROGRESS'],['COMPLETED','COMPLETED']]),...pagination]],['Por inspector','GET','/api/preventives/by-inspector/{inspectorId}','Ejecuciones asignadas a un inspector.',[textField('inspectorId','Identificador de inspector','1',true,'number'),...pagination]],['Por fecha','GET','/api/preventives/by-due-date','Fechas previstas dentro de un rango inclusivo.',[textField('from','Desde','2026-01-01',true,'date'),textField('to','Hasta','2026-12-31',true,'date'),...pagination]],['Asignar','PUT','/api/preventives/{id}/assignment','Asigna un inspector a un preventivo pendiente.',[textField('id','Identificador de preventivo','1',true,'number'),jsonField({inspectorId:1})]],['Iniciar','PUT','/api/preventives/{id}/start','Pasa un preventivo asignado a IN_PROGRESS.',[textField('id','Identificador de preventivo','1',true,'number')]],['Registrar trabajo','PUT','/api/preventives/{id}/work-performed','Registra el trabajo realizado mientras está en curso.',[textField('id','Identificador de preventivo','1',true,'number'),jsonField({workPerformed:''})]],['Completar','PUT','/api/preventives/{id}/completion','Completa un preventivo en curso con trabajo registrado.',[textField('id','Identificador de preventivo','1',true,'number')]]]} };
Object.values(entities).forEach(entity=>entity.actions=entity.actions.map(([label,method,path,description,fields])=>({label,method,path,description,fields})));
let currentEntity='users',currentAction=0; let paginationState={page:'0',size:'20'}; const resultCache=new Map(); const byId=id=>document.getElementById(id); const currentKey=()=>`${currentEntity}:${currentAction}`;
function renderMenu(){const menu=byId('entity-menu');menu.replaceChildren();Object.entries(entities).forEach(([key,entity])=>{const button=document.createElement('button');button.className=key===currentEntity?'active':'';const icon=document.createElement('span');icon.className='entity-icon';icon.textContent=entity.icon;const label=document.createElement('span');label.className='label';label.textContent=entity.label;button.append(icon,label);button.onclick=()=>{currentEntity=key;currentAction=0;render();};menu.append(button);});}
function renderOperations(){const tabs=byId('operation-tabs');tabs.replaceChildren();entities[currentEntity].actions.forEach((action,index)=>{const button=document.createElement('button');button.textContent=action.label;button.className=index===currentAction?'active':'';button.onclick=()=>{currentAction=index;render();};tabs.append(button);});}
function fieldElement(field){const label=document.createElement('label');label.htmlFor=field.name;label.append(document.createTextNode(field.label));if(field.type==='json'){const textarea=document.createElement('textarea');textarea.id=field.name;textarea.name=field.name;textarea.required=field.required;textarea.value=field.value;label.append(textarea);return label;}let control;if(field.type==='select'){control=document.createElement('select');field.values.forEach(([value,labelText])=>control.add(new Option(labelText,value)));}else{control=document.createElement('input');control.type=field.type||'text';control.placeholder=field.example||'';if(field.type==='number')control.min='0';}control.id=field.name;control.name=field.name;control.required=field.required;if(field.name==='page')control.value='0';if(field.name==='size')control.value='20';label.append(control);return label;}
function renderForm(action){byId('request-title').textContent=action.label;byId('request-description').textContent=action.description;const body=byId('form-body');body.replaceChildren();const normal=action.fields.filter(field=>field.type!=='json'&&!field.resultControl),json=action.fields.filter(field=>field.type==='json');if(normal.length){const row=document.createElement('div');row.className=normal.length===1?'':'field-row';normal.forEach(field=>row.append(fieldElement(field)));body.append(row);}json.forEach(field=>body.append(fieldElement(field)));if(action.method==='GET'&&action.path.includes('by-email')){const hint=document.createElement('p');hint.className='hint';hint.textContent='La búsqueda admite texto parcial. “adfa.dsdf” es válido como búsqueda y puede no devolver resultados.';body.append(hint);}byId('execute-button').textContent=`${action.method==='GET'?'Ejecutar consulta':'Ejecutar operación'} · ${action.method}`;}
function resetResult(){byId('executed-endpoint').textContent='Aún no se ha ejecutado ningún endpoint.';byId('response-status').textContent='';byId('response-status').className='status';const result=byId('result-content');result.replaceChildren();const empty=document.createElement('div');empty.className='empty';const strong=document.createElement('strong');strong.textContent='Preparado para consultar';empty.append(strong,'Selecciona una operación, completa los datos necesarios y ejecútala.');result.append(empty);}function restoreResult(){const cached=resultCache.get(currentKey());if(!cached){resetResult();return;}byId('executed-endpoint').textContent=cached.endpoint;byId('response-status').textContent=cached.statusText;byId('response-status').className=cached.statusClass;renderResult(cached.payload);}
function render(){const entity=entities[currentEntity],action=entity.actions[currentAction];byId('breadcrumb-entity').textContent=entity.label;byId('breadcrumb-action').textContent=action.label;byId('entity-title').textContent=entity.label;byId('entity-description').textContent=entity.description;byId('endpoint-method').textContent=action.method;byId('endpoint-method').className=`method ${action.method.toLowerCase()}`;byId('endpoint-path').textContent=action.path;renderMenu();renderOperations();renderForm(action);restoreResult();}
function errorMessage(payload,fallback){return payload?.message||payload?.errors?.map(error=>error.message||error.defaultMessage).filter(Boolean).join(' · ')||fallback;}function resolvedPath(action,formData){let path=action.path.replace(/\{([^}]+)}/g,(_,key)=>encodeURIComponent(formData.get(key)));const query=new URLSearchParams();action.fields.filter(field=>field.type!=='json'&&!action.path.includes(`{${field.name}}`)).forEach(field=>{const value=field.resultControl?paginationState[field.name]:formData.get(field.name);if(value!==null&&value!=='')query.set(field.name,value);});return query.size?`${path}?${query}`:path;}function scalar(value){if(value===null||value===undefined)return'—';if(typeof value==='object')return value.name||value.email||value.assetCode||value.id||JSON.stringify(value);return String(value);}function rowsFrom(payload){const data=payload?.data??payload;if(Array.isArray(data))return data;if(Array.isArray(data?.content))return data.content;return data&&typeof data==='object'?[data]:[];}
function renderPagination(pageData){const pagination=document.createElement('div'),previous=document.createElement('button'),next=document.createElement('button'),summary=document.createElement('span'),sizeLabel=document.createElement('label'),size=document.createElement('select');pagination.className='pagination';previous.type='button';previous.textContent='Anterior';previous.disabled=pageData.page===0;previous.onclick=()=>{paginationState.page=String(pageData.page-1);byId('request-form').requestSubmit();};next.type='button';next.textContent='Siguiente';next.disabled=pageData.page>=pageData.totalPages-1;next.onclick=()=>{paginationState.page=String(pageData.page+1);byId('request-form').requestSubmit();};summary.textContent=`Página ${pageData.page+1} de ${pageData.totalPages} · ${pageData.totalElements} resultados`;sizeLabel.textContent='Tamaño ';[10,20,50,100].forEach(value=>size.add(new Option(String(value),String(value),false,value===pageData.size)));size.onchange=()=>{paginationState.size=size.value;paginationState.page='0';byId('request-form').requestSubmit();};sizeLabel.append(size);pagination.append(previous,next,summary,sizeLabel);return pagination;}
function renderResult(payload){const result=byId('result-content'),data=payload?.data??payload;result.replaceChildren();const rows=rowsFrom(payload);if(!rows.length){const empty=document.createElement('div');empty.className='empty';const strong=document.createElement('strong');strong.textContent='La consulta no ha devuelto resultados';empty.append(strong,'Prueba con otro criterio o verifica que existen datos para el filtro aplicado.');result.append(empty);}else{const keys=[...new Set(rows.flatMap(row=>Object.keys(row)))],wrapper=document.createElement('div'),table=document.createElement('table'),head=document.createElement('thead'),headRow=document.createElement('tr'),tableBody=document.createElement('tbody');wrapper.className='result-table-wrap';table.className='result-table';keys.forEach(key=>{const cell=document.createElement('th');cell.textContent=key;headRow.append(cell);});head.append(headRow);rows.forEach(row=>{const tr=document.createElement('tr');keys.forEach(key=>{const td=document.createElement('td');td.textContent=scalar(row[key]);td.title=td.textContent;tr.append(td);});tableBody.append(tr);});table.append(head,tableBody);wrapper.append(table);result.append(wrapper);}if(Array.isArray(data?.content)&&Number.isInteger(data.page)){paginationState={page:String(data.page),size:String(data.size)};result.append(renderPagination(data));}const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='Ver respuesta JSON completa';pre.textContent=JSON.stringify(payload,null,2);details.append(summary,pre);result.append(details);}
function cacheResult(key,endpoint,statusText,statusClass,payload){resultCache.set(key,{endpoint,statusText,statusClass,payload});if(key===currentKey()){byId('executed-endpoint').textContent=endpoint;byId('response-status').textContent=statusText;byId('response-status').className=statusClass;renderResult(payload);}}
async function execute(event){event.preventDefault();const action=entities[currentEntity].actions[currentAction],form=event.currentTarget,requestKey=currentKey();if(!form.reportValidity())return;const formData=new FormData(form),payloadField=formData.get('payload');let body;if(payloadField!==null){try{body=JSON.stringify(JSON.parse(payloadField));}catch{byId('response-status').textContent='El cuerpo JSON no es válido.';byId('response-status').className='status error';return;}}const path=resolvedPath(action,formData),endpoint=`${action.method} ${path}`,button=byId('execute-button'),status=byId('response-status');button.disabled=true;status.textContent='Solicitando…';status.className='status';byId('executed-endpoint').textContent=endpoint;try{const response=await fetch(path,{method:action.method,headers:body?{'Content-Type':'application/json','Accept':'application/json'}:{'Accept':'application/json'},...(body?{body}:{})}),payload=await response.json().catch(()=>null),statusText=`${response.ok?'Correcto':'Error'} · HTTP ${response.status}`,statusClass=`status ${response.ok?'ok':'error'}`,resultPayload=response.ok?payload:{message:errorMessage(payload,'La operación no se ha podido completar.'),details:payload};cacheResult(requestKey,endpoint,statusText,statusClass,resultPayload);}catch(error){cacheResult(requestKey,endpoint,'No se ha podido conectar con la API','status error',{message:'Comprueba que la aplicación está en ejecución y que esta página se abre desde ella.',details:String(error)});}finally{button.disabled=false;}}
byId('request-form').addEventListener('submit',execute);render();
</script>
